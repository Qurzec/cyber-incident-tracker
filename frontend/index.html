<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Трекер інцидентів кібербезпеки</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Трекер інцидентів кібербезпеки</h1>

      <div class="main-content">
        <!-- Ліва колонка: Форма додавання та редагування інцидентів -->
        <div class="form-section" id="formSection">
          <h2 id="formTitle">Додати новий інцидент</h2>
          <form id="incidentForm" novalidate>
            <div class="form-group">
              <label for="incidentDate">Дата та час:</label>
              <input type="datetime-local" id="incidentDate" required />
              <span class="error-text" id="dateError"></span>
            </div>

            <div class="form-group">
              <label for="incidentTag">Тип (Тег):</label>
              <select id="incidentTag" required>
                <option value="">-- Оберіть тип --</option>
                <option value="Фішинг">Фішинг</option>
                <option value="Вредоносне ПО">Вредоносне ПО</option>
                <option value="DDoS">DDoS</option>
                <option value="Несанкціонований доступ">
                  Несанкціонований доступ
                </option>
                <option value="Інше">Інше</option>
              </select>
              <span class="error-text" id="tagError"></span>
            </div>

            <div class="form-group">
              <label for="incidentSeverity">Рівень загрози:</label>
              <select id="incidentSeverity" required>
                <option value="">-- Оберіть рівень --</option>
                <option value="Низький">Низький</option>
                <option value="Середній">Середній</option>
                <option value="Високий">Високий</option>
                <option value="Критичний">Критичний</option>
              </select>
              <span class="error-text" id="severityError"></span>
            </div>

            <div class="form-group">
              <label for="incidentReporter">Хто повідомив:</label>
              <input
                type="text"
                id="incidentReporter"
                placeholder="Прізвище та ім'я"
                required
              />
              <span class="error-text" id="reporterError"></span>
            </div>

            <div class="form-group">
              <label for="incidentComments">Коментарі:</label>
              <textarea
                id="incidentComments"
                rows="3"
                placeholder="Опишіть деталі інциденту..."
              ></textarea>
              <span class="error-text" id="commentsError"></span>
            </div>

            <div class="form-actions">
              <button type="submit" id="submitBtn">Додати інцидент</button>
              <button type="button" id="cancelEditBtn" style="display: none">
                Скасувати редагування
              </button>
            </div>
          </form>
        </div>

        <!-- Права колонка: Список інцидентів та панель керування -->
        <div class="list-section">
          <h2>Список інцидентів</h2>

          <!-- Панель пошуку, фільтрації та сортування (на відмінно) -->
          <div class="filter-panel">
            <div class="filter-group">
              <label for="searchReporter">Пошук за репортером:</label>
              <input
                type="text"
                id="searchReporter"
                placeholder="Прізвище чи ім'я..."
              />
            </div>
            <div class="filter-group">
              <label for="filterTag">Фільтр за типом:</label>
              <select id="filterTag">
                <option value="">Усі типи</option>
                <option value="Фішинг">Фішинг</option>
                <option value="Вредоносне ПО">Вредоносне ПО</option>
                <option value="DDoS">DDoS</option>
                <option value="Несанкціонований доступ">
                  Несанкціонований доступ
                </option>
                <option value="Інше">Інше</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="sortDate">Сортування за датою:</label>
              <select id="sortDate">
                <option value="newest">Спочатку новіші</option>
                <option value="oldest">Спочатку старіші</option>
              </select>
            </div>
          </div>

          <div class="table-container">
            <table id="incidentTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Дата та час</th>
                  <th>Тип</th>
                  <th>Рівень</th>
                  <th>Репортер</th>
                  <th>Коментарі</th>
                  <th>Дії</th>
                </tr>
              </thead>
              <tbody id="incidentList">
                <!-- Сюди JS буде додавати рядки -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
